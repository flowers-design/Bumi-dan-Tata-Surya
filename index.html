<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Tata Surya — Rotasi & Revolusi Bumi</title>
<style>
:root{
  --midnight:#0a0e27;
  --deep:#141b4d;
  --deep2:#1e2a78;
  --lavender:#b8b5ff;
  --gold:#ffc93c;
  --gold2:#ffb800;
  --white:#ffffff;
  --soft:#e8ecff;
  --card:rgba(30,42,120,0.55);
  --border:rgba(184,181,255,0.25);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
html{scroll-behavior:smooth}
body{
  background:linear-gradient(180deg,#0a0e27 0%,#141b4d 50%,#0a0e27 100%);
  color:var(--white);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.6;
}
/* ===== STARFIELD ===== */
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:white;border-radius:50%;opacity:.7;animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes orbitAnim{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== NAVBAR ===== */
nav{
  position:sticky;top:0;z-index:1000;
  background:rgba(10,14,39,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 20px;
}
.nav-wrap{max-width:1300px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:65px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;cursor:pointer;color:var(--gold)}
.logo-icon{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#4a9eff,#1e40af 60%,#0a1a3a);position:relative;box-shadow:0 0 12px rgba(74,158,255,.6)}
.logo-icon::after{content:'';position:absolute;width:44px;height:44px;border:1.5px solid var(--gold);border-radius:50%;top:-5px;left:-5px;border-right-color:transparent;transform:rotate(-30deg)}
.nav-menu{display:flex;gap:4px;list-style:none;align-items:center}
.nav-menu a{
  color:var(--soft);text-decoration:none;padding:8px 12px;border-radius:8px;
  font-size:.85rem;font-weight:500;transition:.2s;cursor:pointer;
}
.nav-menu a:hover,.nav-menu a.active{background:rgba(255,201,60,.15);color:var(--gold)}
.hamburger{display:none;background:none;border:none;color:var(--white);font-size:1.6rem;cursor:pointer}

/* ===== PAGES ===== */
.page{display:none;max-width:1200px;margin:0 auto;padding:30px 20px 80px;position:relative;z-index:1;animation:fadeUp .5s ease}
.page.active{display:block}

/* ===== HERO ===== */
.hero{
  text-align:center;padding:50px 20px 30px;position:relative;
  max-width:1100px;margin:0 auto;
}
.hero-visual{
  width:260px;height:260px;margin:0 auto 25px;position:relative;
}
.sun-hero{
  width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc93c 50%,#ff8c00);
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 40px rgba(255,201,60,.8),0 0 80px rgba(255,140,0,.4);
  animation:float 4s infinite ease-in-out;
}
.earth-hero{
  width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#4a9eff,#1e40af 55%,#0a1a3a);
  position:absolute;top:0;left:50%;transform-origin:0 130px;
  animation:orbitAnim 12s linear infinite;
  box-shadow:0 0 15px rgba(74,158,255,.8),inset -6px -4px 10px rgba(0,0,0,.5);
}
.earth-hero::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 70% 40%,#2ecc71 0 20%,transparent 22%),
             radial-gradient(circle at 30% 65%,#27ae60 0 15%,transparent 17%);
  opacity:.9}
.orbit-line-hero{
  position:absolute;top:50%;left:50%;width:260px;height:260px;
  transform:translate(-50%,-50%);border:1px dashed rgba(184,181,255,.35);
  border-radius:50%;
}
.badge-hero{
  display:inline-block;padding:6px 16px;border-radius:20px;
  background:rgba(255,201,60,.12);border:1px solid rgba(255,201,60,.4);
  color:var(--gold);font-size:.8rem;font-weight:600;letter-spacing:1px;margin-bottom:18px;
}
.hero h1{
  font-size:clamp(1.8rem,5vw,3rem);font-weight:800;line-height:1.15;
  background:linear-gradient(135deg,#fff 30%,var(--gold) 70%,#b8b5ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:12px;letter-spacing:-.5px;
}
.hero .sub{font-size:1.15rem;color:var(--lavender);margin-bottom:10px;font-weight:500}
.hero p.desc{max-width:640px;margin:0 auto 28px;color:#c5c9e8;font-size:.95rem}
.btn-group{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:35px}
.btn{
  padding:13px 28px;border-radius:12px;border:none;cursor:pointer;font-size:.92rem;
  font-weight:600;transition:.25s;display:inline-flex;align-items:center;gap:8px;
  text-decoration:none;font-family:inherit;
}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1400;box-shadow:0 6px 20px rgba(255,201,60,.35)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(255,201,60,.5)}
.btn-secondary{background:rgba(184,181,255,.12);color:var(--white);border:1.5px solid var(--border)}
.btn-secondary:hover{background:rgba(184,181,255,.22);transform:translateY(-3px);border-color:var(--lavender)}
.btn-ghost{background:transparent;color:var(--lavender);border:1.5px solid var(--border);padding:9px 18px;font-size:.85rem}
.btn-ghost:hover{background:rgba(184,181,255,.12);color:var(--white)}
.btn-sm{padding:9px 18px;font-size:.82rem}
.hero-meta{
  display:flex;gap:20px;justify-content:center;flex-wrap:wrap;
  font-size:.8rem;color:#a8adcf;
}
.hero-meta span{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* ===== SECTION TITLE ===== */
.section-title{text-align:center;margin-bottom:35px}
.section-title h2{font-size:clamp(1.4rem,3.5vw,2rem);font-weight:700;color:var(--white);margin-bottom:8px}
.section-title h2 span{color:var(--gold)}
.section-title p{color:#a8adcf;font-size:.9rem}
.title-line{width:60px;height:3px;background:linear-gradient(90deg,var(--gold),var(--lavender));margin:12px auto 0;border-radius:3px}

/* ===== CARDS ===== */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-bottom:40px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:24px;backdrop-filter:blur(10px);transition:.3s;position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--lavender),transparent);opacity:.6}
.card:hover{transform:translateY(-5px);border-color:var(--lavender);box-shadow:0 15px 40px rgba(0,0,0,.4)}
.card-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;margin-bottom:16px;background:linear-gradient(135deg,rgba(255,201,60,.2),rgba(184,181,255,.2));
  border:1px solid var(--border)}
.card h3{font-size:1.1rem;margin-bottom:8px;color:var(--white);font-weight:700}
.card p{font-size:.87rem;color:#b8bce0;margin-bottom:16px}

/* ===== MATERI ===== */
.materi-layout{display:grid;grid-template-columns:220px 1fr;gap:25px}
.toc{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  position:sticky;top:85px;height:fit-content;
}
.toc h4{color:var(--gold);font-size:.9rem;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
.toc a{display:block;color:#c5c9e8;text-decoration:none;font-size:.83rem;padding:8px 10px;border-radius:8px;
  transition:.2s;border-left:2px solid transparent;cursor:pointer}
.toc a:hover,.toc a.active{background:rgba(184,181,255,.1);color:var(--gold);border-left-color:var(--gold)}
.materi-content{background:rgba(232,236,255,.04);border:1px solid var(--border);border-radius:16px;padding:28px}
.materi-content h2{color:var(--gold);font-size:1.4rem;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.materi-content h3{color:var(--lavender);font-size:1.05rem;margin:22px 0 10px}
.materi-content p{color:#d0d4ee;font-size:.9rem;margin-bottom:12px;text-align:justify}
.materi-content ul{margin:10px 0 15px 22px;color:#d0d4ee;font-size:.9rem}
.materi-content li{margin-bottom:6px}
.highlight{background:rgba(255,201,60,.12);padding:14px 18px;border-left:3px solid var(--gold);
  border-radius:8px;margin:16px 0;font-size:.88rem;color:#e8ecff}
.term{color:var(--gold);font-weight:600;border-bottom:1px dashed var(--gold);cursor:help}
.accordion{background:rgba(184,181,255,.06);border:1px solid var(--border);border-radius:10px;margin:12px 0;overflow:hidden}
.accordion-header{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  font-weight:600;font-size:.9rem;color:var(--white);transition:.2s}
.accordion-header:hover{background:rgba(184,181,255,.1)}
.accordion-body{max-height:0;overflow:hidden;transition:.3s;padding:0 18px;font-size:.87rem;color:#c5c9e8}
.accordion.open .accordion-body{max-height:400px;padding:0 18px 16px}
.accordion.open .arrow{transform:rotate(180deg)}
.arrow{transition:.3s;color:var(--gold)}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.85rem}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border)}
th{background:rgba(255,201,60,.12);color:var(--gold);font-weight:600}
td{color:#d0d4ee}
tr:hover td{background:rgba(184,181,255,.05)}

/* ===== VIDEO ===== */
.video-grid{display:grid;grid-template-columns:1fr;gap:25px}
.video-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.video-thumb{
  width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#0a1a3a,#141b4d);
  position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.video-thumb-rotasi::before{content:'';position:absolute;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#4a9eff,#1e40af 55%,#0a1a3a);
  box-shadow:inset -15px -10px 25px rgba(0,0,0,.6),0 0 30px rgba(74,158,255,.5);
  animation:spin 6s linear infinite}
.video-thumb-revolusi::before{content:'';position:absolute;width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc93c 50%,#ff8c00);
  box-shadow:0 0 30px rgba(255,201,60,.7);animation:float 3s infinite ease-in-out}
.video-thumb-revolusi::after{content:'';position:absolute;width:180px;height:180px;border:1.5px dashed rgba(184,181,255,.4);
  border-radius:50%;animation:orbitAnim 15s linear infinite}
.earth-mini{position:absolute;width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#4a9eff,#1e40af 60%);
  box-shadow:inset -4px -3px 8px rgba(0,0,0,.5);
  animation:orbitAnim 8s linear infinite;transform-origin:90px center;top:calc(50% - 17px);left:calc(50% - 90px)}
.play-btn{
  position:absolute;width:70px;height:70px;border-radius:50%;
  background:rgba(255,201,60,.95);border:none;cursor:pointer;z-index:3;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 8px rgba(255,201,60,.2),0 8px 25px rgba(0,0,0,.4);
  transition:.3s;font-size:1.6rem;color:#1a1400;padding-left:6px;
}
.play-btn:hover{transform:scale(1.1);box-shadow:0 0 0 14px rgba(255,201,60,.15),0 8px 30px rgba(0,0,0,.5)}
.video-info{padding:20px 22px}
.video-info .tag{display:inline-block;font-size:.7rem;padding:3px 10px;border-radius:12px;
  background:rgba(255,201,60,.15);color:var(--gold);margin-bottom:8px;font-weight:600;letter-spacing:.5px}
.video-info h3{font-size:1.15rem;margin-bottom:8px;color:var(--white)}
.video-info p{font-size:.85rem;color:#b8bce0;margin-bottom:14px}
.video-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:#a8adcf;margin-bottom:14px}
.video-actions{display:flex;gap:10px;flex-wrap:wrap}
.video-frame{width:100%;aspect-ratio:16/9;border:none;display:block}
.done-tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:#4ade80;font-weight:600}

/* ===== SIMULASI ===== */
.sim-container{
  background:radial-gradient(ellipse at center,#141b4d 0%,#0a0e27 80%);
  border:1px solid var(--border);border-radius:18px;overflow:hidden;position:relative;
}
#simCanvas{display:block;width:100%;height:500px;touch-action:none;cursor:grab}
.sim-controls{
  display:flex;flex-wrap:wrap;gap:10px;padding:16px 20px;
  background:rgba(10,14,39,.85);border-top:1px solid var(--border);align-items:center;
}
.sim-controls .btn{padding:9px 16px;font-size:.8rem}
.sim-controls label{font-size:.8rem;color:#c5c9e8;display:flex;align-items:center;gap:8px}
input[type=range]{accent-color:var(--gold);width:110px}
.sim-info{display:flex;gap:18px;flex-wrap:wrap;padding:0 20px 16px;font-size:.78rem;color:#a8adcf}

/* ===== EKSPLORASI ===== */
.explore-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:22px}
.explore-card h3{color:var(--gold);font-size:1.1rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.explore-card h3 .num{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1a1400;
  display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
.explore-canvas{width:100%;height:260px;background:#06091c;border-radius:12px;margin:14px 0;display:block}
.explore-q{font-size:.9rem;color:var(--soft);font-weight:600;margin:14px 0 10px}
.opt-btn{
  display:block;width:100%;text-align:left;padding:11px 16px;margin-bottom:8px;
  background:rgba(184,181,255,.08);border:1px solid var(--border);border-radius:9px;
  color:var(--soft);font-size:.85rem;cursor:pointer;transition:.2s;font-family:inherit;
}
.opt-btn:hover{background:rgba(184,181,255,.16);border-color:var(--lavender)}
.opt-btn.correct{background:rgba(74,222,128,.18);border-color:#4ade80;color:#a7f3d0}
.opt-btn.wrong{background:rgba(248,113,113,.15);border-color:#f87171;color:#fca5a5}
.feedback{margin-top:10px;font-size:.85rem;padding:10px 14px;border-radius:8px;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(74,222,128,.12);color:#a7f3d0;border-left:3px solid #4ade80}
.feedback.no{background:rgba(248,113,113,.1);color:#fca5a5;border-left:3px solid #f87171}

/* ===== GAME ===== */
.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.game-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.3s}
.game-card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 15px 40px rgba(0,0,0,.5)}
.game-thumb{width:100%;height:170px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.game-thumb-1{background:linear-gradient(135deg,#1e2a78,#4a3f9e)}
.game-thumb-2{background:linear-gradient(135deg,#2d1b69,#5b3fa8)}
.game-thumb-3{background:linear-gradient(135deg,#1a3a5c,#2e6b9e)}
.game-thumb svg{width:90px;height:90px;opacity:.9}
.game-label{position:absolute;top:12px;left:12px;font-size:.68rem;padding:4px 10px;border-radius:10px;
  background:rgba(255,201,60,.9);color:#1a1400;font-weight:700;letter-spacing:.5px}
.game-info{padding:20px}
.game-info h3{font-size:1.05rem;margin-bottom:8px;color:var(--white)}
.game-info p{font-size:.83rem;color:#b8bce0;margin-bottom:16px;min-height:60px}
.tips-box{background:rgba(255,201,60,.08);border:1px solid rgba(255,201,60,.3);border-radius:12px;padding:18px;margin-top:25px}
.tips-box h4{color:var(--gold);font-size:.95rem;margin-bottom:10px}
.tips-box ul{margin-left:20px;font-size:.85rem;color:#d0d4ee}
.tips-box li{margin-bottom:6px}

/* ===== LATIHAN & KUIS ===== */
.quiz-wrap{max-width:760px;margin:0 auto}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.progress-bar{height:8px;background:rgba(184,181,255,.15);border-radius:10px;overflow:hidden;margin-bottom:22px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--lavender));border-radius:10px;transition:.4s;width:0}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px}
.q-num{color:var(--gold);font-size:.8rem;font-weight:700;letter-spacing:1px;margin-bottom:10px}
.q-text{font-size:1.05rem;color:var(--white);margin-bottom:20px;font-weight:600;line-height:1.5}
.q-options{display:flex;flex-direction:column;gap:10px}
.opt{
  padding:14px 18px;background:rgba(184,181,255,.07);border:1.5px solid var(--border);border-radius:11px;
  color:var(--soft);font-size:.9rem;cursor:pointer;transition:.2s;text-align:left;font-family:inherit;
  display:flex;align-items:center;gap:12px;
}
.opt:hover{background:rgba(184,181,255,.15);border-color:var(--lavender)}
.opt.selected{background:rgba(255,201,60,.18);border-color:var(--gold);color:var(--white)}
.opt .letter{width:26px;height:26px;border-radius:50%;background:rgba(184,181,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.opt.selected .letter{background:var(--gold);color:#1a1400}
.opt.correct-final{background:rgba(74,222,128,.18);border-color:#4ade80}
.opt.wrong-final{background:rgba(248,113,113,.15);border-color:#f87171}

/* ===== FORM ===== */
.form-card{max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px}
.form-card h2{color:var(--gold);font-size:1.3rem;margin-bottom:8px;text-align:center}
.form-card p.sub{text-align:center;color:#a8adcf;font-size:.85rem;margin-bottom:24px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.85rem;color:var(--soft);margin-bottom:7px;font-weight:500}
.field input{
  width:100%;padding:12px 15px;border-radius:10px;border:1.5px solid var(--border);
  background:rgba(10,14,39,.7);color:var(--white);font-size:.9rem;font-family:inherit;transition:.2s;
}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,60,.15)}
.field input.err{border-color:#f87171}
.field .msg{font-size:.75rem;color:#f87171;margin-top:5px;display:none}
.field .msg.show{display:block}

/* ===== HASIL ===== */
.result-card{max-width:700px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px;text-align:center}
.score-circle{width:160px;height:160px;margin:20px auto;position:relative}
.score-circle svg{transform:rotate(-90deg)}
.score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-num .val{font-size:2.6rem;font-weight:800;color:var(--gold);line-height:1}
.score-num .lbl{font-size:.75rem;color:#a8adcf;letter-spacing:1px}
.identity-box{background:rgba(184,181,255,.07);border-radius:12px;padding:16px;margin:20px 0;font-size:.88rem}
.identity-box .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)}
.identity-box .row:last-child{border-bottom:none}
.identity-box .row span:first-child{color:#a8adcf}
.identity-box .row span:last-child{color:var(--white);font-weight:600}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.stat-box{background:rgba(184,181,255,.07);border-radius:12px;padding:16px}
.stat-box .v{font-size:1.8rem;font-weight:800;line-height:1}
.stat-box .l{font-size:.78rem;color:#a8adcf;margin-top:4px}
.stat-box.good .v{color:#4ade80}
.stat-box.bad .v{color:#f87171}
.eval-msg{padding:16px;border-radius:12px;margin:18px 0;font-size:.9rem;line-height:1.6}
.eval-msg.excellent{background:rgba(74,222,128,.12);border-left:4px solid #4ade80;color:#d1fae5}
